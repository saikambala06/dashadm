<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #121212; height: 100vh; display: flex; justify-content: center; align-items: center; }

    /* ADMIN STYLES */
    .admin-container {
      width: 900px; max-width: 95vw; height: 600px;
      background: #1a1a1a; border-radius: 12px;
      border: 1px solid #333;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      display: flex; flex-direction: column; overflow: hidden;
    }

    .admin-header {
      background: #222; padding: 20px; border-bottom: 1px solid #333;
      display: flex; justify-content: space-between; align-items: center;
    }
    .admin-title { color: #fff; font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
    .admin-badge { background: #e1306c; color: white; padding: 2px 8px; border-radius: 4px; font-size: 11px; text-transform: uppercase; }
    
    .admin-content { flex: 1; padding: 20px; overflow-y: auto; }
    
    .stats-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px;
    }
    .stat-card {
      background: #252525; padding: 20px; border-radius: 8px; border: 1px solid #333;
    }
    .stat-val { font-size: 24px; color: #fff; font-weight: 700; margin-bottom: 5px; }
    .stat-label { color: #777; font-size: 13px; }

    .data-table-wrapper {
      background: #252525; border-radius: 8px; border: 1px solid #333; overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { background: #2a2a2a; color: #888; font-weight: 500; text-align: left; padding: 12px 20px; border-bottom: 1px solid #333; }
    td { color: #ddd; padding: 12px 20px; border-bottom: 1px solid #333; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #2a2a2a; }
    
    .pass-col { font-family: monospace; letter-spacing: 1px; color: #6ab0ff; }
    .action-btn {
      background: #333; border: none; color: #ff6b6b; padding: 6px 12px;
      border-radius: 4px; cursor: pointer; font-size: 12px;
    }
    .action-btn:hover { background: #444; }

    .empty-state { padding: 40px; text-align: center; color: #555; }

    /* Buttons */
    .btn-danger {
      background: #333; color: #ff6b6b; border: 1px solid #ff6b6b;
      padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px;
    }
    .btn-danger:hover { background: #ff6b6b; color: white; }
    
    .btn-home {
      background: #1877F2; color: white; border: none;
      padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="admin-container">
    <div class="admin-header">
      <div class="admin-title">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="#1877F2"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
        Admin Portal <span class="admin-badge">Dashboard</span>
      </div>
      <div style="display: flex; gap: 10px;">
        <button class="btn-danger" onclick="clearAllData()">Clear Database</button>
        <a href="index.html" class="btn-home">Back to Login</a>
      </div>
    </div>

    <div class="admin-content">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-val" id="totalCount">0</div>
          <div class="stat-label">Total Captures</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" id="lastCapture">Never</div>
          <div class="stat-label">Latest Capture</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" style="color: #2ecc71;">Active</div>
          <div class="stat-label">System Status</div>
        </div>
      </div>

      <div class="data-table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Time</th>
              <th>Username / Email</th>
              <th>Password</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="savedTableBody">
            <!-- Data injected here -->
          </tbody>
        </table>
        <div id="emptyState" class="empty-state">
          No captured data yet. Go to <a href="index.html" style="color:#6ab0ff;">Login Page</a> and try to log in.
        </div>
      </div>
    </div>
  </div>

  <script>
    /**
     * MOCK BACKEND SERVICE
     * Identical to the one in index.html
     */
    class MockBackend {
      constructor() {
        this.storageKey = 'ig_simulation_users_db';
      }
      saveLogin(username, password) {
        const currentData = this.getAll();
        const newRecord = {
          id: Date.now(),
          timestamp: new Date().toLocaleString(),
          username: username,
          password: password
        };
        currentData.push(newRecord);
        localStorage.setItem(this.storageKey, JSON.stringify(currentData));
        return true;
      }
      getAll() {
        const data = localStorage.getItem(this.storageKey);
        return data ? JSON.parse(data) : [];
      }
      deleteRecord(id) {
        let data = this.getAll();
        data = data.filter(record => record.id !== id);
        localStorage.setItem(this.storageKey, JSON.stringify(data));
      }
      clearAll() {
        localStorage.removeItem(this.storageKey);
      }
    }

    const db = new MockBackend();

    // RENDER TABLE LOGIC
    function renderAdminTable() {
      const data = db.getAll();
      const tbody = document.getElementById('savedTableBody');
      const emptyState = document.getElementById('emptyState');
      const totalCountEl = document.getElementById('totalCount');
      const lastCaptureEl = document.getElementById('lastCapture');

      // Update Stats
      totalCountEl.textContent = data.length;
      if (data.length > 0) {
        lastCaptureEl.textContent = data[data.length - 1].timestamp.split(',')[1]; 
        emptyState.style.display = 'none';
      } else {
        lastCaptureEl.textContent = 'Never';
        emptyState.style.display = 'block';
      }

      // Clear Table
      tbody.innerHTML = '';

      // Build Rows (Newest first)
      [...data].reverse().forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${item.timestamp}</td>
          <td>${escapeHtml(item.username)}</td>
          <td class="pass-col">${escapeHtml(item.password)}</td>
          <td>
            <button class="action-btn" onclick="deleteEntry(${item.id})">Delete</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function deleteEntry(id) {
      if(confirm('Delete this record?')) {
        db.deleteRecord(id);
        renderAdminTable();
      }
    }

    function clearAllData() {
      if(confirm('Are you sure you want to wipe the entire database?')) {
        db.clearAll();
        renderAdminTable();
      }
    }

    function escapeHtml(text) {
      if (!text) return text;
      return text
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
    }

    // Auto-refresh table every 2 seconds to catch new logins from other tabs
    setInterval(renderAdminTable, 2000);
    
    // Initial Load
    document.addEventListener('DOMContentLoaded', renderAdminTable);
  </script>
</body>
</html>
